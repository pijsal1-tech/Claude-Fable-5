# ═══════════════════════════════════════════════════════
#   WebDev AI Editor — Configuration
# ═══════════════════════════════════════════════════════

# المزود الافتراضي (use_ai | يمكن إضافة gemini, openai مستقبلاً)
default_provider: "use_ai"

# مسار المشروع (يُحدد يدوياً عند التشغيل)
project_root: ""

# اللغة (ar = عربي | en = إنجليزي | mix = مزيج)
language: "mix"

# طلب إذن قبل تنفيذ الأوامر
auto_execute: false

# نسخ احتياطي قبل أي تعديل
backup_before_edit: true

# أقصى عدد ملفات يقرأها كسياق
max_context_files: 15

# ميزانية السياق (T-024 / R-203) — ContextBudget.from_config يقرأ هذا القسم.
# budget_tokens = (model_window - reserved_output) × (1 - safety_margin)
context_budget:
  model_window: 128000     # نافذة الموديل بالتوكنز
  reserved_output: 8000    # محجوز لمخرجات الموديل
  safety_margin: 0.10      # هامش أمان لعدم دقة المقدّر (بند مخاطر R-203)

# ربط الجلسة بالمشروع (T-031 / R-303) — كل جلسة تُختم ببصمة مشروعها
# (sha256 لمساره المُحلّ، أول 12 حرفًا). عند تبديل المشروع مع جلسة مرتبطة
# بمشروع مختلف تُطبَّق السياسة:
#   warn  → السماح بالتبديل مع حقن بانر تنبيه في سياق كل رسالة
#           حتى بدء جلسة جديدة (الافتراضي الآمن).
#   fork  → مسح تاريخ المحادثة وفتح جلسة جديدة مرتبطة بالمشروع الجديد.
#   block → رفض التبديل بـ 409 وبقاء المشروع الحالي كما هو.
# warn_only: true (الافتراضي) يتجاهل policy ويفرض warn دائمًا —
# اجعله false لتفعيل قيمة policy أدناه.
session_binding:
  warn_only: true
  policy: "warn"

# استبقاء artifacts الـ runs (T-033 / R-305) — مسح GC عند الإقلاع على
# مجلد .ai_runs داخل المشروع. الحدود المعلّقة (~) = غير مفعّلة.
#   max_count:    أحدث N من الـ runs تبقى (المثبتات لا تُحسب من N).
#   max_age_days: ما تجاوز هذا العمر يُحذف حتى لو داخل العدد.
#   pinned:       أسماء runs تنجو دائمًا (مثال: ["run-ab12cd34"]).
#   dry_run: true (الافتراضي الآمن) = تسجيل ما كان سيُحذف دون حذف
#            فعلي — اجعله false لتفعيل الحذف الحقيقي.
retention:
  max_count: ~
  max_age_days: ~
  pinned: []
  dry_run: true

# عتبات التوجيه (T-036 / R-402) — RequestRouter يقرأ هذا القسم عبر
# thresholds_from_config (تحقق صارم: مفتاح مجهول/نوع خاطئ/ترتيب مكسور
# = فشل صاخب عند الإقلاع). القيم أدناه هي الافتراضات التاريخية —
# القسم كله اختياري وحذفه = نفس السلوك.
#
# دليل الضبط (threshold tuning guide):
#   score = مجموع 5 أبعاد تعقيد (حجم + عدد ملفات + علاقات + غموض + مخاطر)
#   direct_max:     score ≤ هذا → direct (رد واحد). ارفعه لتقليل السلاسل
#                   على الطلبات البسيطة؛ أنزله لمزيد من التحليل المبكر.
#   auto_chain_max: score ≤ هذا → auto_chain (2-3 خطوات).
#   full_chain_max: score ≤ هذا → full_chain (3-4 خطوات)؛ ما فوقه delegate.
#   الشرط: direct_max < auto_chain_max < full_chain_max (يُفحص عند الإقلاع).
#   min_accounts_*: أدنى حسابات متاحة لكل مسار — عند النقص يحدث downgrade
#                   تدريجي (delegate→full_chain→auto_chain→direct).
#   الشرط: auto_chain ≤ full_chain ≤ delegate، وكلها ≥ 1.
#   version: رقم إصدار تُختم به سجلات RoutingRecord — ارفعه عند أي تغيير
#            حتى تُميَّز القرارات المسجلة قبل الضبط وبعده.
routing:
  direct_max: 2.0
  auto_chain_max: 5.0
  full_chain_max: 8.0
  min_accounts_auto_chain: 2
  min_accounts_full_chain: 3
  min_accounts_delegate: 4
  version: 1

# إعدادات المزودين
providers:
  use_ai:
    model: "gateway-claude-sonnet-5"
    ws_timeout: 90
    request_timeout: 12
    auto_register: true
    auto_register_max: 5
    accounts_file: "accounts_use_ai.json"
    create_share: true

  # مثال: إضافة Gemini مستقبلاً
  # gemini:
  #   api_key: ""
  #   model: "gemini-2.5-pro"

  # مثال: إضافة OpenAI مستقبلاً
  # openai:
  #   api_key: ""
  #   model: "gpt-4o"
