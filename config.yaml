# ═══════════════════════════════════════════════════════
#   WebDev AI Editor — Configuration
# ═══════════════════════════════════════════════════════

# المزود الافتراضي (use_ai | يمكن إضافة gemini, openai مستقبلاً)
default_provider: "use_ai"

# مسار المشروع (يُحدد يدوياً عند التشغيل)
project_root: ""

# اللغة (ar = عربي | en = إنجليزي | mix = مزيج)
language: "mix"

# طلب إذن قبل تنفيذ الأوامر
auto_execute: false

# نسخ احتياطي قبل أي تعديل
backup_before_edit: true

# أقصى عدد ملفات يقرأها كسياق
max_context_files: 15

# أوامر الـ Agent (T-058 / R-504) — command_policy_from يقرأ هذا القسم.
# run_command ينفذ الأوامر المذكورة هنا **فقط** — القائمة ملكية المشروع،
# الـ agent لا يختار أوامر حرة أبدًا. أي أمر خارج القائمة = رفض مهيكل
# صريح ومسجَّل (لا تنفيذ صامت). حذف command_allowlist بالكامل = وضع
# legacy: بوابة الموافقة وحدها تحكم (سلوك ما قبل T-058).
# ملاحظة: القائمة طبقة إضافية فوق ApprovalGate — أمر مسموح هنا لا يزال
# يحتاج موافقة المستخدم التفاعلية.
#   المفتاح = اسم منطقي (test/lint/typecheck/build...)، القيمة = الأمر
#   الحرفي. الـ agent يطلب بالأمر الحرفي أو بالاسم المنطقي — مطابقة
#   تامة بعد توحيد الفراغات (لا بادئات، لا أنماط).
#   command_timeout_seconds:   مهلة الأمر الواحد (انتهاؤها = فشل صريح).
#   command_output_max_chars:  سقف كل مجرى مخرجات (stdout/stderr) —
#                              الزائد يُقتطع بعلامة صريحة.
#
# عقد خطوة التحقق (T-059 / R-504) — يُفعَّل تلقائيًا بوجود هذا القسم:
#   1. إن احتوت القائمة أحد الأسماء (test/lint/typecheck/build) يُحقن في
#      برومبت الـ agent قسم [خطوة التحقق — إلزامية لمهام تعديل الكود]:
#      شغّل أمر الاختبار → اقرأ نتيجته → أصلح عند الفشل → لا تعلن نجاحًا
#      لمهمة كود دون تحقق ناجح. حذف القسم (وضع legacy) = لا حقن.
#   2. نتيجة كل run_command تدخل التكرار التالي كعنصر سياق طبقة high —
#      مخرجات الفشل وقودُ الإصلاح ولا تسقط عند ضغط الميزانية.
#   3. أي ملفات يغيّرها الأمر (منسّق تلقائي مثلًا) تُلتقط snapshot/seal
#      في CheckpointManager نفسه المستخدم لكتابات الـ chain — لا مسار
#      تعديل غير مبوَّب وغير قابل للاسترجاع.
agent:
  command_allowlist:
    test: "python -m pytest -q"
    lint: "python -m mypy --ignore-missing-imports ."
    typecheck: "python -m mypy --ignore-missing-imports ."
    build: "python -m compileall -q ."
  command_timeout_seconds: 60
  command_output_max_chars: 8000

# ميزانية السياق (T-024 / R-203) — ContextBudget.from_config يقرأ هذا القسم.
# budget_tokens = (model_window - reserved_output) × (1 - safety_margin)
context_budget:
  model_window: 128000     # نافذة الموديل بالتوكنز
  reserved_output: 8000    # محجوز لمخرجات الموديل
  safety_margin: 0.10      # هامش أمان لعدم دقة المقدّر (بند مخاطر R-203)

# الاسترجاع الدلالي (T-057 / R-206) — SemanticSource يقرأ هذا القسم عبر
# semantic_config_from. بذرة مصغَّرة: backend افتراضي hashing-BoW محلي
# (صفر شبكة/تبعيات — الترقية لـ backend حقيقي مجال R-802/Phase 8).
# العناصر تُحقن بطبقة opportunistic فقط — لا تزاحم must_have/high أبدًا.
#   enabled:         false = إيقاف نظيف (المصدر يعيد [] دائمًا).
#   timeout_seconds: مهلة خط الاسترجاع كاملًا — تجاوزها = skip صامت،
#                    لا يعطّل الرد أبدًا (skip-on-timeout).
#   top_k:           عدد العناصر المسترجعة لكل رسالة.
context:
  semantic:
    enabled: true
    timeout_seconds: 2.0
    top_k: 3

# ربط الجلسة بالمشروع (T-031 / R-303) — كل جلسة تُختم ببصمة مشروعها
# (sha256 لمساره المُحلّ، أول 12 حرفًا). عند تبديل المشروع مع جلسة مرتبطة
# بمشروع مختلف تُطبَّق السياسة:
#   warn  → السماح بالتبديل مع حقن بانر تنبيه في سياق كل رسالة
#           حتى بدء جلسة جديدة (الافتراضي الآمن).
#   fork  → مسح تاريخ المحادثة وفتح جلسة جديدة مرتبطة بالمشروع الجديد.
#   block → رفض التبديل بـ 409 وبقاء المشروع الحالي كما هو.
# warn_only: true (الافتراضي) يتجاهل policy ويفرض warn دائمًا —
# اجعله false لتفعيل قيمة policy أدناه.
session_binding:
  warn_only: true
  policy: "warn"

# استبقاء artifacts الـ runs (T-033 / R-305) — مسح GC عند الإقلاع على
# مجلد .ai_runs داخل المشروع. الحدود المعلّقة (~) = غير مفعّلة.
#   max_count:    أحدث N من الـ runs تبقى (المثبتات لا تُحسب من N).
#   max_age_days: ما تجاوز هذا العمر يُحذف حتى لو داخل العدد.
#   pinned:       أسماء runs تنجو دائمًا (مثال: ["run-ab12cd34"]).
#   dry_run: true (الافتراضي الآمن) = تسجيل ما كان سيُحذف دون حذف
#            فعلي — اجعله false لتفعيل الحذف الحقيقي.
retention:
  max_count: ~
  max_age_days: ~
  pinned: []
  dry_run: true

# المخطِّط (T-106/T-107 / R-803) — planner_from_config يقرأ هذا المفتاح
# عند الإقلاع. حذف المفتاح = heuristic (الصريح والافتراضي متكافئان)؛
# اسم مجهول = فشل إقلاع صاخب لا سقوط صامت.
#   heuristic: المنطق التاريخي (regex + عتبات تعقيد) — صفر نداء موديل.
#   llm:       الموديل يقترح الخطة؛ تحقق schema صارم + فحص سعة —
#              أي عائق (رد فاسد/فوق السعة/عطل مزود) = سقوط نظيف
#              لخطة heuristic مع سجل قرار يسمّي السبب
#              (plan.metadata["planner_record"]). force_strategy
#              يتجاوز الموديل دائمًا.
#   hybrid:    بوابة استدلالية → صقل LLM: التوصية البسيطة
#              (direct/context_window) تُعتمد بلا موديل؛ المعقدة تمر
#              لمسار llm بكل حراسته.
# التبديل بينها = تعديل هذا المفتاح فقط — صفر تعديل كود (بند R-803).
planner: "heuristic"

# الـ Backend (T-108 / R-804) — backends_from_config يقرأ هذا المفتاح
# عند تحميل server.py ويبني ExecutionRegistry + EventBus الرصدي العام.
# حذف المفتاح = memory (الصريح والافتراضي متكافئان)؛ اسم مجهول = فشل
# إقلاع صاخب لا سقوط صامت.
#   memory: الافتراضيان التاريخيان داخل-العملية حرفيًّا (aliases لا
#           أغلفة) — صفر تبعيات جديدة، أحادي-العملية درجة أولى.
# T-109 أضاف أصناف Redis Streams (core/backends_redis.py — ناقل أحداث
# stream-لكل-run + قائمة عمل بمجموعة مستهلكين): extra اختياري
# `pip install "redis>=5.0"`، والعنوان من متغير البيئة REDIS_URL
# (الافتراضي redis://localhost:6379/0). مسوَّغات الشكل (standalone،
# لا Cluster/Sentinel في v1) في docs/phase8_plan.md §3. ربطها بقيمة
# `backend:` هنا يكتمل في T-110 مع سجل Redis وliase المشاريع —
# حتى حينها القيمة الصالحة الوحيدة memory.
backend: "memory"

# عتبات التوجيه (T-036 / R-402) — RequestRouter يقرأ هذا القسم عبر
# thresholds_from_config (تحقق صارم: مفتاح مجهول/نوع خاطئ/ترتيب مكسور
# = فشل صاخب عند الإقلاع). القيم أدناه هي الافتراضات التاريخية —
# القسم كله اختياري وحذفه = نفس السلوك.
#
# دليل الضبط (threshold tuning guide):
#   score = مجموع 5 أبعاد تعقيد (حجم + عدد ملفات + علاقات + غموض + مخاطر)
#   direct_max:     score ≤ هذا → direct (رد واحد). ارفعه لتقليل السلاسل
#                   على الطلبات البسيطة؛ أنزله لمزيد من التحليل المبكر.
#   auto_chain_max: score ≤ هذا → auto_chain (2-3 خطوات).
#   full_chain_max: score ≤ هذا → full_chain (3-4 خطوات)؛ ما فوقه delegate.
#   الشرط: direct_max < auto_chain_max < full_chain_max (يُفحص عند الإقلاع).
#   min_accounts_*: أدنى حسابات متاحة لكل مسار — عند النقص يحدث downgrade
#                   تدريجي (delegate→full_chain→auto_chain→direct).
#   الشرط: auto_chain ≤ full_chain ≤ delegate، وكلها ≥ 1.
#   version: رقم إصدار تُختم به سجلات RoutingRecord — ارفعه عند أي تغيير
#            حتى تُميَّز القرارات المسجلة قبل الضبط وبعده.
routing:
  direct_max: 2.0
  auto_chain_max: 5.0
  full_chain_max: 8.0
  min_accounts_auto_chain: 2
  min_accounts_full_chain: 3
  min_accounts_delegate: 4
  version: 1

# إعدادات المزودين
providers:
  use_ai:
    model: "gateway-claude-sonnet-5"
    ws_timeout: 90
    request_timeout: 12
    auto_register: true
    auto_register_max: 5
    accounts_file: "accounts_use_ai.json"
    create_share: true

  # مثال: إضافة Gemini مستقبلاً
  # gemini:
  #   api_key: ""
  #   model: "gemini-2.5-pro"

  # مثال: إضافة OpenAI مستقبلاً
  # openai:
  #   api_key: ""
  #   model: "gpt-4o"
